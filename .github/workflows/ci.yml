name: CI (Ejercicio 2 - Estructura)

on:
  push:
    branches: ['**']

  pull_request:
    branches: [develop, master]

  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        required: false
        default: false
        type: boolean

jobs:
  ci:
    name: CI Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch:  ${{ github.ref_name }}"
          echo "SHA:     ${{ github.sha }}"
          echo "OS:      ${{ runner.os }}"
          echo "Runner:  ${{ runner.name }}"
