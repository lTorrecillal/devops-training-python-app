name: CI/CD - Ejercicios 1 a 7 Prueba

on:
  push:
    branches: ['**']        # Ejecuta en push a cualquier rama
  pull_request:
    branches: [develop, master]  # Ejecuta en PR hacia develop/master
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Simular entorno (DEV/PRO)'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

# Variables a nivel de workflow
env:
  IMAGE_NAME: "contrerasadr/devops-training-python-app:0.0.1"
  APP_URL: "http://localhost:5002/"

jobs:
  ci:
    name: CI Job
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}
    env:
      APP_URL: "http://localhost:5003/"

    steps:
      # -----------------------------------
      # Ejercicio 1: Checkout
      # -----------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------
      # Ejercicio 2: Info del runner
      # -----------------------------------
      - name: Info
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "SHA:    $GITHUB_SHA"
          echo "OS:     $RUNNER_OS"
          echo "Runner: $RUNNER_NAME"

      # -----------------------------------
      # Ejercicio 3: Variables workflow y job
      # -----------------------------------
      - name: Variables workflow y job
        run: |
          echo "IMAGE_NAME = $IMAGE_NAME"
          echo "APP_URL (job) = $APP_URL"

      # -----------------------------------
      # Ejercicio 4: Inputs workflow_dispatch
      # -----------------------------------
      - name: Inputs workflow_dispatch
        run: |
          echo "RUN_CD = ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV = ${{ inputs.DEPLOY_ENV }}"

      # -----------------------------------
      # Ejercicio 5: Variables de entorno adicionales
      # -----------------------------------
      - name: Variables
        run: |
          echo "REGISTRY_HOST = ${{ vars.REGISTRY_HOST }}"
          echo "ARTIFACTORY_URL = ${{ vars.ARTIFACTORY_URL }}"
          echo "Registry user = ${{ secrets.REGISTRY_USER }}"

      # -----------------------------------
      # Ejercicio 6: CI en contenedor python:3.6-slim
      # -----------------------------------
      - name: Instalar dependencias y ejecutar tests en python:3.6-slim
        container:
          image: python:3.6-slim
        run: |
          apt-get update && apt-get install -y gcc libpq-dev build-essential
          pip install --no-cache-dir -r requirements.txt
          make lint
          make test

      # -----------------------------------
      # Ejercicio 7: Build Docker image
      # -----------------------------------
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME -f devops/Dockerfile .
