# -----------------------------------
# EJERCICIO 8-9: CD
# -----------------------------------
cd:
  name: CD Job
  runs-on: ubuntu-latest
  needs: ci

  if: ${{ (github.ref_name == 'develop' || github.ref_name == 'master') && github.event.inputs.RUN_CD == 'true' }}

  steps:

    - name: Checkout
      uses: actions/checkout@v4

    # Build imagen para el deploy
    - name: Build image for deploy
      run: docker build -t $IMAGE_NAME -f devops/Dockerfile .

    # Deploy
    - name: Deploy with docker compose
      run: docker compose up -d

    # Mostrar logs
    - name: Show logs
      run: docker compose logs app

    # Cleanup SIEMPRE
    - name: Cleanup
      if: always()
      run: docker compose down -v
